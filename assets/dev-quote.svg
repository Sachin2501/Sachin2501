<svg xmlns="http://www.w3.org/2000/svg" width="700" height="120" viewBox="0 0 700 120" role="img" aria-label="Rotating developer quotes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1b26"/><stop offset="1" stop-color="#24283b"/></linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e75b6"/><stop offset="1" stop-color="#6f42c1"/></linearGradient>
</defs>
<rect x="2" y="2" width="696" height="116" rx="16" fill="none" stroke="url(#glow)" stroke-width="2"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/></rect>
<rect x="8" y="8" width="684" height="104" rx="12" fill="url(#bg)"/>
<text x="30" y="40" fill="#bb9af7" font-family="Consolas,Menlo,monospace" font-size="14">// dev quote</text>
<text x="350" y="75" fill="#c0caf5" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" opacity="0">First, make it work. Then make it right. Then make it fast.<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.147;0.167;1" dur="24s" repeatCount="indefinite"/></text>
<text x="350" y="75" fill="#c0caf5" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" opacity="0">Code is read far more often than it is written.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.167;0.187;0.313;0.333;1" dur="24s" repeatCount="indefinite"/></text>
<text x="350" y="75" fill="#c0caf5" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" opacity="0">Debugging is just a conversation with your past self.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.353;0.480;0.500;1" dur="24s" repeatCount="indefinite"/></text>
<text x="350" y="75" fill="#c0caf5" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" opacity="0">Small commits today, big projects tomorrow.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.520;0.647;0.667;1" dur="24s" repeatCount="indefinite"/></text>
<text x="350" y="75" fill="#c0caf5" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" opacity="0">Ship it, learn from it, improve it.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.667;0.687;0.813;0.833;1" dur="24s" repeatCount="indefinite"/></text>
<text x="350" y="75" fill="#c0caf5" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" opacity="0">Every expert was once a beginner who kept coding.<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.833;0.853;1" dur="24s" repeatCount="indefinite"/></text>
<rect x="30" y="98" width="50" height="3" rx="1.5" fill="#0e75b6"><animate attributeName="x" values="30;620;30" dur="8s" repeatCount="indefinite"/></rect>
</svg>